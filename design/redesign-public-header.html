<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;font-family:'Schibsted Grotesk',sans-serif">
  <div style="background:#0B1426;color:#C9CFDC;display:flex;align-items:center;gap:24px;padding:0 48px;height:36px;font-size:12px">
    <span style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:#1FBF84"></span><span style="font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#1FBF84">AI PULSE</span></span>
    <span style="color:#FFFFFF">EU AI Act enforcement begins for general-purpose models</span>
    <span style="color:#24304A">/</span>
    <span>SBP sandbox opens to AI credit-scoring pilots</span>
    <span style="flex:1"></span>
    <span style="font:500 11px/1 'JetBrains Mono',monospace">1,000 pts = <span style="color:#F2B233">Rs 250</span></span>
    <span style="color:#24304A">|</span>
    <span style="font-family:'Noto Nastaliq Urdu',serif;font-size:12px;line-height:1">اردو</span>
  </div>
  <div style="background:#FFFFFF;border-bottom:1px solid #E3E2DA;display:flex;align-items:center;gap:40px;padding:0 48px;height:76px">
    <div style="display:flex;align-items:center;gap:11px">
      <div style="display:grid;grid-template-columns:repeat(3,8px);gap:2px">
        <div style="height:8px;background:#087A54;border-radius:2px"></div><div style="height:8px;background:#087A54;border-radius:2px"></div><div style="height:8px;background:#F2B233;border-radius:50%"></div>
        <div style="height:8px;background:#087A54;border-radius:2px"></div><div style="height:8px"></div><div style="height:8px;background:#087A54;border-radius:2px"></div>
        <div style="height:8px;background:#087A54;border-radius:2px"></div><div style="height:8px;background:#087A54;border-radius:2px"></div><div style="height:8px"></div>
      </div>
      <div style="display:flex;align-items:baseline;gap:6px;line-height:1;color:#0B1426">
        <span style="font-weight:700;font-size:20px;letter-spacing:-0.02em">Digitize</span>
        <span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#5A6173">Pakistan</span>
      </div>
    </div>
    <nav style="display:flex;gap:4px;background:#F4F3EE;padding:4px;border-radius:12px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <sc-if value="{{ n.active }}"><span style="font-size:14px;font-weight:600;color:#0B1426;background:#FFFFFF;padding:8px 16px;border-radius:9px;box-shadow:0 1px 2px rgba(11,20,38,.08)">{{ n.label }}</span></sc-if>
        <sc-if value="{{ n.inactive }}"><span style="font-size:14px;font-weight:500;color:#5A6173;padding:8px 16px;border-radius:9px">{{ n.label }}</span></sc-if>
      </sc-for>
    </nav>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:10px;border:1px solid #E3E2DA;border-radius:11px;padding:0 12px;height:40px;width:220px;color:#8A8F9C;font-size:13px">
      <span style="width:11px;height:11px;border:1.6px solid #8A8F9C;border-radius:50%"></span><span style="flex:1">Search news & tools</span><span style="font:500 10px/1 'JetBrains Mono',monospace;border:1px solid #E3E2DA;border-radius:5px;padding:3px 5px">/</span>
    </div>
    <span style="font-size:14px;font-weight:600;color:#0B1426">Log in</span>
    <div style="display:flex;align-items:center;gap:10px;background:#087A54;color:#FFFFFF;font-size:14px;font-weight:600;padding:0 16px;height:42px;border-radius:11px">
      Start earning <span style="font:600 10px/1 'JetBrains Mono',monospace;background:#F2B233;color:#0B1426;padding:4px 6px;border-radius:5px">+100</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:112},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;News&quot;,&quot;AI Tools&quot;,&quot;Learn&quot;,&quot;Rewards&quot;,&quot;None&quot;],&quot;default&quot;:&quot;News&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'News';
    return { nav: ['News','AI Tools','Learn','Rewards'].map(label => ({ label, active: label === a, inactive: label !== a })) };
  }
}
</script>
</body>
</html>
